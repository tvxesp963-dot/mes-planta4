// ¿A qué planta se envía? (columna Destino del BOM, publicada por el BOM Simulator en plan_piso_p1). Igual que la etiqueta de Pallet Medio P1.
function enviarA(pn,desc){
  var L=(PLAN&&PLAN.destinos)||[], x=L.filter(function(y){ return norm(y.pn)===norm(pn) && norm(y.desc)===norm(desc); })[0];
  if(/SET PAD|PHONE PAD/.test(norm(desc))) return 'P3';
  var d=x?String(x.d||'').toUpperCase():'';
  if(d==='P3') return 'P3'; if(d==='ALIBER') return 'ALIBER'; if(d==='P1'||d==='P4') return 'P4'; return '';
}
// Solo se envía lo que sale de la ÚLTIMA etapa de P1 para ese código (no las hojas a medio proceso entre máquinas de P1)
function ultimasMaqs(){
  var out={}, mx={};
  if(!PLAN||!PLAN.colas) return out;
  Object.keys(PLAN.colas).forEach(function(m){ (PLAN.colas[m]||[]).forEach(function(e){ var k=norm(e.pn), et=Number(e.etapa)||0; if(mx[k]===undefined||et>mx[k]){ mx[k]=et; out[k]={}; } if(et===mx[k]) out[k][m]=1; }); });
  return out;
}
function ordId(pn,desc){ return (norm(pn)+'_'+norm(desc)).replace(/[^A-Z0-9_-]/g,'_').slice(0,120); }

function armar(){
  var ult=ultimasMaqs(), ords={};
  function get(pn,desc){ var k=norm(pn)+'||'+norm(desc); return ords[k]||(ords[k]={pn:norm(pn),desc:desc||'',id:ordId(pn,desc),req:0,listo:[],cam:[],ent:[],modelos:{}}); }
  ((REQ&&REQ.items)||[]).forEach(function(it){ var o=get(it.pn,it.desc); o.req+=Number(it.pide||it.falta)||0; (it.modelos||[]).forEach(function(m){ o.modelos[m.sm]=1; }); o.fecha=it.fecha||''; o.prioridad=it.prioridad||999; });
  PALS.forEach(function(p){
    if((p.planta||'P4')!=='P1' || p.status==='VOID') return;
    var u=ult[norm(p.parte)]; if(u && !u[p.maquina]) return;
    var o=get(p.parte,p.desc), doc=ORD[o.id];
    if(doc && doc.abiertaMs && (p.horaMs||0)<doc.abiertaMs) return;   // pallets de una orden anterior ya cerrada
    if(p.modelo) o.modelos[p.modelo]=1;
    if(p.status==='RECEIVED' || p.entregaManual) o.ent.push(p);
    else if(p.envio) o.cam.push(p);
    else o.listo.push(p);
  });
  return Object.keys(ords).map(function(k){
    var o=ords[k], doc=ORD[o.id]||null, s=function(a){ return a.reduce(function(x,p){ return x+(Number(p.qty)||0); },0); };
    o.qL=s(o.listo); o.qC=s(o.cam); o.qE=s(o.ent);
    o.dest=enviarA(o.pn,o.desc) || (o.listo.concat(o.cam,o.ent)[0]||{}).enviarA || '';
    o.total=o.req+o.qE;                                 // lo pedido = lo que ya llegó + lo que el plan aún pide
    o.falta=Math.max(0,o.req-o.qL-o.qC);                // falta producir (lo listo y en camino aún no entra al IMS)
    o.cerrada=!!(doc && doc.estado==='cerrada');
    o.completa=!o.cerrada && o.req<=0 && o.qL===0 && o.qC===0 && o.qE>0;
    o.est=o.cerrada?'cer':(o.completa?'ent':(o.qC>0?'proc':(o.qL>0?'pend':'prod')));
    o.doc=doc;
    return o;
  }).filter(function(o){ return o.total>0 || o.qL>0 || o.qC>0 || o.cerrada; });
}
var cerrandoAuto={};
function autoCerrar(lista){
  if(!REQ || !PLAN) return;   // sin el plan cargado no se cierra nada
  lista.forEach(function(o){
    if(!o.completa || cerrandoAuto[o.id]) return; cerrandoAuto[o.id]=1;
    db.collection('envios_p1_ordenes').doc(o.id).set({pn:o.pn,desc:o.desc,estado:'cerrada',cerradaEn:new Date().toISOString(),cerradaPor:t('auto'),motivo:'auto',entregado:o.qE},{merge:true}).catch(function(e){ console.warn(e); });
  });
}
function pintar(){
  pintarLangs();
  var app=$('app');
  if(!REQ && !PALS.length){ app.innerHTML='<div class="msg">…</div>'; return; }
  var todas=armar(); autoCerrar(todas);
  var lista=todas.filter(function(o){ return (vista==='cerradas')===o.cerrada; }).filter(function(o){ return !filtro || o.dest===filtro; })
    .sort(function(a,b){ var r={pend:0,proc:1,prod:2,ent:3,cer:4}; return (r[a.est]-r[b.est]) || ((a.fecha||'9999')<(b.fecha||'9999')?-1:(a.fecha||'9999')>(b.fecha||'9999')?1:0) || ((a.prioridad||999)-(b.prioridad||999)); });
  var dests=[]; todas.forEach(function(o){ if(o.dest && dests.indexOf(o.dest)<0) dests.push(o.dest); }); dests.sort();

// ===== Excel: mismo formato que el Plan por día (título azul, franja verde, encabezados azul marino en ES + EN · KO,
// bandas de color por planta destino, bordes, cantidades en azul claro, estados en color y renglón de total) =====
function exportarExcel(lista){
  if(typeof XLSX==='undefined' || !lista || !lista.length){ alert(t('xSinD')); return; }
  var ahora=new Date();
  function h3(k){ var es=T.es[k], en=T.en[k], ko=T.ko[k]; return es+'\n'+en+' · '+ko; }
  function tr3(k){ return T.es[k]+' · '+T.en[k]+' · '+T.ko[k]; }
  var EST={prod:['stProd','FF666666'],pend:['stPend','FF946200'],proc:['stProc','FF1A4F9C'],ent:['stEnt','FF0A7A3E'],cer:['stCer','FF666666']};
  var BANDA={P4:'FF0F6B3C',P3:'FF7A4A00',ALIBER:'FF1A4F9C'};
  var L={style:'thin',color:{rgb:'FF9AA6BF'}}, BORDE={top:L,left:L,bottom:L,right:L};
  var F=function(o){ return Object.assign({name:'Calibri',sz:11},o||{}); };
  function libro(titulo, head, anchos, filasPorGrupo, numCols, colEst){
    var nC=head.length, aoa=[], st={}, merges=[], alto={};
    function put(r,c,v,s){ (aoa[r]=aoa[r]||[])[c]=v; st[r+','+c]=s; }
    function unir(r,txt,s,h){ put(r,0,txt,s); for(var c=1;c<nC;c++) put(r,c,'',s); merges.push({s:{r:r,c:0},e:{r:r,c:nC-1}}); if(h) alto[r]=h; }
    var r=0;
    unir(r++,titulo,{font:F({sz:18,bold:true,color:{rgb:'FF1A3A6B'}}),alignment:{vertical:'center'}},30);
    unir(r++,'MES P1 · '+tr3('remFe')+': '+ahora.toLocaleString(T.es.loc),{font:F({bold:true,color:{rgb:'FF0A5C30'}}),fill:{patternType:'solid',fgColor:{rgb:'FFE3F6EA'}},alignment:{vertical:'center'}},20);
    unir(r++,'Requerido = plan del BOM Simulator · Destino = columna Destino del BOM · Entregado = escaneado en el IMS de la planta destino',{font:F({sz:10,color:{rgb:'FF555555'}})},18);
    r++;
    var totG={}; numCols.forEach(function(c){ totG[c]=0; });
    filasPorGrupo.forEach(function(g){
      unir(r++,g.titulo,{font:F({sz:12,bold:true,color:{rgb:'FFFFFFFF'}}),fill:{patternType:'solid',fgColor:{rgb:BANDA[g.dest]||'FF1A4F9C'}},alignment:{vertical:'center'}},22);
      head.forEach(function(h,c){ put(r,c,h,{font:F({sz:10,bold:true,color:{rgb:'FFFFFFFF'}}),fill:{patternType:'solid',fgColor:{rgb:'FF1A3A6B'}},border:BORDE,alignment:{vertical:'center',horizontal:c<=2?'left':'center',wrapText:true}}); });
      alto[r]=46; r++;
      var tot={}; numCols.forEach(function(c){ tot[c]=0; });
      g.filas.forEach(function(f){
        var lineas=1;
        f.v.forEach(function(v,c){
          var esNum=numCols.indexOf(c)>=0, s={border:BORDE,font:F({bold:c===0}),alignment:{vertical:'center',wrapText:true,horizontal:esNum?'right':(c===colEst||c<=2?'left':'center')}};
          if(esNum){ s.numFmt='#,##0'; if(v>0){ s.font=F({bold:true}); s.fill={patternType:'solid',fgColor:{rgb:'FFEAF3FF'}}; } tot[c]+=Number(v)||0; }
          if(c===colEst){ s.font=F({bold:true,color:{rgb:(EST[f.est]||EST.prod)[1]}}); }
          if(c===f.destCol){ s.font=F({bold:true,sz:12}); }
          if(typeof v==='string') lineas=Math.max(lineas,v.split('\n').length);
          put(r,c,(esNum && !(v>0))?'–':v,esNum && !(v>0)?Object.assign({},s,{font:F({color:{rgb:'FFB0B6C4'}}),alignment:{horizontal:'center',vertical:'center'}}):s);
        });
        alto[r]=Math.max(22,15*lineas+6); r++;
      });
      head.forEach(function(_,c){ var v=c===0?tr3('remTot'):(numCols.indexOf(c)>=0?tot[c]:''); put(r,c,v,{font:F({bold:true}),fill:{patternType:'solid',fgColor:{rgb:'FFF2F4F9'}},border:BORDE,numFmt:numCols.indexOf(c)>=0?'#,##0':undefined,alignment:{vertical:'center',horizontal:numCols.indexOf(c)>=0?'right':'left'}}); });
      alto[r]=22; r+=2;
      numCols.forEach(function(c){ totG[c]+=tot[c]; });
    });
    var ws=XLSX.utils.aoa_to_sheet(aoa.map(function(x){ var o=[]; for(var c=0;c<nC;c++) o[c]=(x&&x[c]!==undefined)?x[c]:''; return o; }));
    Object.keys(st).forEach(function(k){ var p=k.split(','), ref=XLSX.utils.encode_cell({r:+p[0],c:+p[1]}); if(ws[ref]) ws[ref].s=st[k]; });
    ws['!merges']=merges; ws['!cols']=anchos.map(function(w){ return {wch:w}; });
    ws['!rows']=[]; Object.keys(alto).forEach(function(k){ ws['!rows'][+k]={hpt:alto[k]}; });
    ws['!views']=[{showGridLines:false}];
    return ws;
  }
  // Agrupar por planta destino (una banda por planta, igual que las secciones del plan por día)
  var dests=[]; lista.forEach(function(o){ var d=o.dest||'—'; if(dests.indexOf(d)<0) dests.push(d); }); dests.sort();
  var gruposO=dests.map(function(d){
    return { dest:d, titulo:'→ '+d+' · '+T.es.thDest+' · '+T.en.thDest+' · '+T.ko.thDest, filas:lista.filter(function(o){ return (o.dest||'—')===d; }).map(function(o){
      var fol={}; o.cam.concat(o.ent).forEach(function(p){ if(p.envio&&p.envio.folio) fol[p.envio.folio]=1; });
      var stE=EST[o.est]||EST.prod, txt=T.es[stE[0]]+' · '+T.en[stE[0]]+' · '+T.ko[stE[0]];
      return { est:o.est, destCol:3, v:[o.pn,o.desc,Object.keys(o.modelos).join('\n'),'→ '+(o.dest||'—'),o.total,o.qL,o.qC,o.qE,o.falta,txt+(Object.keys(fol).length?'\n'+T.es.xFol+': '+Object.keys(fol).join(', '):'')] };
    }) };
  });
  var wsO=libro(T.es.title+' · '+T.en.title+' · '+T.ko.title,
    [h3('remPn'),h3('remDs'),h3('xMod'),h3('thDest'),h3('thReq'),h3('thListo'),h3('thCam'),h3('thEnt'),h3('thFalta'),h3('thEst')],
    [16,28,24,10,12,12,12,12,13,46], gruposO, [4,5,6,7,8], 9);
  var gruposP=dests.map(function(d){
    var filas=[];
    lista.filter(function(o){ return (o.dest||'—')===d; }).forEach(function(o){
      [['pend',o.listo],['proc',o.cam],['ent',o.ent]].forEach(function(g){
        g[1].forEach(function(p){
          var em=p.entregaManual, envEn=p.envio&&p.envio.en?new Date(p.envio.en).toLocaleString(T.es.loc):'';
          var entEn=em&&em.en?new Date(em.en).toLocaleString(T.es.loc):(p.recibidoEn||'');
          var stE=EST[g[0]], txt=T.es[stE[0]]+' · '+T.en[stE[0]]+' · '+T.ko[stE[0]];
          filas.push({ est:g[0], destCol:-1, v:[p.id,p.parte,(p.desc||'')+(p.modelo?'\n'+p.modelo:''),p.maquina||'',Number(p.qty)||0,(p.envio&&p.envio.folio)||'',envEn,entEn+(em&&em.recibio?'\n'+T.es.xRec+': '+em.recibio:''),txt] });
        });
      });
    });
    return { dest:d, titulo:'→ '+d+' · '+T.es.xPal+' · '+T.en.xPal+' · '+T.ko.xPal, filas:filas };
  }).filter(function(g){ return g.filas.length; });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,wsO,'Ordenes · Orders');
  if(gruposP.length) XLSX.utils.book_append_sheet(wb,libro(T.es.title+' · '+T.en.title+' · '+T.ko.title+' — '+T.es.xPal,
    [h3('remPal'),h3('remPn'),h3('remDs'),h3('xMaq'),h3('remQ'),h3('remF'),h3('xEnv'),h3('xEntr'),h3('thEst')],
    [22,16,30,10,12,18,20,22,40], gruposP, [4], 8),'Pallets');
  var f=ymd(ahora)+'_'+String(ahora.getHours()).padStart(2,'0')+'h'+String(ahora.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb,'Envios_P1_'+(vista==='cerradas'?'cerradas_':'')+(filtro?filtro+'_':'')+f+'.xlsx');
}

// ===== Enviar: marca los pallets como "en camino" con folio de remisión =====
var envSel={}, envDest='', envPals=[];
function abrirEnvio(dest,pals){
  envDest=dest; envPals=pals.slice().sort(function(a,b){ return (a.horaMs||0)-(b.horaMs||0); }); envSel={}; envPals.forEach(function(p){ envSel[p.id]=true; });
  $('mEnvT').textContent=t('mEnvT')(dest||'—'); $('mEnvS').textContent=t('mEnvS'); $('mEnvOk').textContent=t('mOk'); $('mEnvNo').textContent=t('mNo'); $('mEnvE').textContent='';
  $('mEnvL').innerHTML=envPals.map(function(p){ return '<label class="pl"><input type="checkbox" checked data-p="'+esc(p.id)+'"><span><b>'+esc(p.id)+'</b> · '+esc(p.parte)+' · '+esc(p.desc)+' · '+esc(p.modelo||'')+'</span><span style="margin-left:auto;font-weight:800">'+n(p.qty)+'</span></label>'; }).join('');
  $('mEnvL').querySelectorAll('input').forEach(function(i){ i.onchange=function(){ envSel[i.dataset.p]=i.checked; }; });
  $('mEnv').classList.remove('hide');
}
$('mEnvNo').onclick=function(){ $('mEnv').classList.add('hide'); };
$('mEnvOk').onclick=async function(){
  var sel=envPals.filter(function(p){ return envSel[p.id]; });
  if(!sel.length){ $('mEnvE').textContent=t('nada'); return; }
  $('mEnvOk').disabled=true;
  try{
    var hoy=ymd(new Date()), base='P1-'+hoy.replace(/-/g,'')+'-', k=1, folio;
    while(true){ folio=base+String(k).padStart(2,'0'); var ex=await db.collection('envios_p1').doc(folio).get(); if(!ex.exists) break; k++; }
    var ahora=new Date().toISOString(), envio={folio:folio,en:ahora,por:nombre(),destino:envDest};
    var b=db.batch();
    sel.forEach(function(p){ b.update(db.collection('pallets_medio').doc(p.id),{envio:envio}); });
    b.set(db.collection('envios_p1').doc(folio),{folio:folio,fecha:hoy,en:ahora,por:nombre(),destino:envDest,pallets:sel.map(function(p){ return {id:p.id,parte:p.parte,desc:p.desc||'',modelo:p.modelo||'',qty:Number(p.qty)||0}; }),total:sel.reduce(function(s,p){ return s+(Number(p.qty)||0); },0)});
    sel.forEach(function(p){ var id=ordId(p.parte,p.desc); if(!ORD[id]) b.set(db.collection('envios_p1_ordenes').doc(id),{pn:norm(p.parte),desc:p.desc||'',estado:'abierta',abiertaMs:0,abiertaEn:ahora},{merge:true}); });
    await b.commit();
    $('mEnv').classList.add('hide'); alert(t('okEnv')(folio)); imprimirRemision(folio);
  }catch(e){ console.error(e); $('mEnvE').textContent=t('errG')+': '+(e.message||e); }
  $('mEnvOk').disabled=false;
};
// Respaldo manual (gerente): solo si la planta destino no escanea el QR en su IMS
async function marcarEntregado(o){
  if(!esGerente()){ alert(t('soloGer')); return; }
  var quien=prompt(t('entQ'),''); if(quien===null||!quien.trim()) return;
  try{ var b=db.batch(), ahora=new Date().toISOString(); o.cam.forEach(function(p){ b.update(db.collection('pallets_medio').doc(p.id),{entregaManual:{por:nombre(),recibio:quien.trim(),en:ahora}}); }); await b.commit(); }
  catch(e){ alert(t('errG')+': '+(e.message||e)); }
}
async function cerrarOrden(o){
  if(!esGerente()){ alert(t('soloGer')); return; }
  var m=prompt(t('cerrarQ'),''); if(m===null||m.trim().length<3) return;
  try{ await db.collection('envios_p1_ordenes').doc(o.id).set({pn:o.pn,desc:o.desc,estado:'cerrada',cerradaEn:new Date().toISOString(),cerradaPor:nombre(),motivo:m.trim(),entregado:o.qE},{merge:true}); }
  catch(e){ alert(t('errG')+': '+(e.message||e)); }
}
// Una orden cerrada se vuelve a abrir sola (orden nueva) cuando el plan pide más o hay pallets nuevos listos
function reabrir(){
  var ahora=Date.now();
  Object.keys(ORD).forEach(function(id){
    var d=ORD[id]; if(d.estado!=='cerrada') return;
    var cerMs=Date.parse(d.cerradaEn||'')||0;
    var pide=((REQ&&REQ.items)||[]).some(function(it){ return ordId(it.pn,it.desc)===id && (Number(it.pide||it.falta)||0)>0; }) && REQ && (REQ.publicadoMs||0)>cerMs;
    var nuevos=PALS.some(function(p){ return (p.planta||'P4')==='P1' && p.status!=='VOID' && ordId(p.parte,p.desc)===id && (p.horaMs||0)>cerMs && !p.envio; });
    if(pide||nuevos) db.collection('envios_p1_ordenes').doc(id).set({estado:'abierta',abiertaMs:ahora,abiertaEn:new Date(ahora).toISOString(),reabierta:(d.reabierta||0)+1},{merge:true}).catch(function(){});
  });
}
async function imprimirRemision(folio){
  var d; try{ d=await db.collection('envios_p1').doc(folio).get(); }catch(e){ alert(t('errG')); return; }
  if(!d.exists) return; var r=d.data();
  var h='<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px"><div><h2>'+t('remT')+'</h2><div>ESP · Eunsung</div></div><div style="text-align:right;font-size:13px"><b>'+t('remF')+': '+esc(r.folio)+'</b><br>'+t('remFe')+': '+new Date(r.en).toLocaleString(t('loc'))+'<br>'+t('remPor')+': '+esc(r.por||'')+'</div></div>'+

    '<table><tr><th>#</th><th>'+t('remPal')+'</th><th>'+t('remPn')+'</th><th>'+t('remDs')+'</th><th>'+t('remMd')+'</th><th style="text-align:right">'+t('remQ')+'</th></tr>'+
    (r.pallets||[]).map(function(p,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(p.id)+'</td><td><b>'+esc(p.parte)+'</b></td><td>'+esc(p.desc)+'</td><td>'+esc(p.modelo)+'</td><td style="text-align:right"><b>'+n(p.qty)+'</b></td></tr>'; }).join('')+
    '<tr><td colspan="5" style="text-align:right"><b>'+t('remTot')+'</b></td><td style="text-align:right"><b>'+n(r.total)+'</b></td></tr></table>'+
    '<div class="fir"><div>'+t('remEntrega')+'</div><div>'+t('remChofer')+'</div><div>'+t('remRecibe')+'</div></div>';
  $('rem').innerHTML=h; setTimeout(function(){ window.print(); },200);
}

// ===== Datos en vivo =====
function escuchar(){
  db.collection('bom_simulator_p4').doc('plan_p1_requerido').onSnapshot(function(s){ REQ=s.exists?s.data():null; reabrir(); pintar(); },function(e){ console.warn(e); });
  db.collection('bom_simulator_p4').doc('plan_piso_p1').onSnapshot(function(s){ PLAN=s.exists?s.data():null; pintar(); },function(e){ console.warn(e); });
  db.collection('envios_p1_ordenes').onSnapshot(function(s){ ORD={}; s.forEach(function(d){ ORD[d.id]=d.data(); }); pintar(); },function(e){ console.warn(e); });
  var d=new Date(); d.setDate(d.getDate()-45);
  db.collection('pallets_medio').where('fecha','>=',ymd(d)).onSnapshot(function(s){ PALS=s.docs.map(function(x){ return Object.assign({id:x.id},x.data()); }).filter(function(p){ return (p.planta||'P4')==='P1'; }); reabrir(); pintar(); },function(e){ console.warn(e); });
}

// ===== Login (con recuperación de contraseña) =====
function mostrarLogin(){
  pintarLangs();
  $('app').innerHTML='<div class="login"><b>'+t('login')+'</b><input id="lgE" type="email" placeholder="'+t('correo')+'"><input id="lgP" type="password" placeholder="'+t('pass')+'"><button class="main" id="lgB">'+t('entrar')+'</button><div class="err" id="lgErr"></div><a id="lgF">'+t('forgot')+'</a></div>';
  $('lgB').onclick=function(){ firebase.auth().signInWithEmailAndPassword($('lgE').value.trim(),$('lgP').value).catch(function(){ $('lgErr').textContent=t('errLogin'); }); };
  $('lgF').onclick=function(){ $('rstT').textContent=t('rstT'); $('rstS').textContent=t('rstS'); $('rstB').textContent=t('rstB'); $('rstC').textContent=t('rstC'); $('rstE').placeholder=t('correo'); $('rstE').value=$('lgE').value; $('rstM').textContent=''; $('rst').classList.remove('hide'); };
}
$('rstC').onclick=function(){ $('rst').classList.add('hide'); };
$('rstB').onclick=function(){ var e=$('rstE').value.trim(), m=$('rstM'); if(!e){ m.style.color='var(--red)'; m.textContent=t('rstErr'); return; }
  firebase.auth().sendPasswordResetEmail(e).then(function(){ m.style.color='var(--green)'; m.textContent=t('rstOk'); }).catch(function(){ m.style.color='var(--red)'; m.textContent=t('rstErr'); }); };
var arrancado=false;
firebase.auth().onAuthStateChanged(async function(u){
  if(!u){ USER=null; mostrarLogin(); return; }
  try{ var q=await db.collection('usuarios_p1').where('uid','==',u.uid).get(); USER=q.empty?{uid:u.uid,email:u.email}:Object.assign({uid:u.uid,email:u.email},q.docs[0].data()); }catch(e){ USER={uid:u.uid,email:u.email}; }
  if(!arrancado){ arrancado=true; escuchar(); }
  pintar();
});
pintarLangs();
</script>
</body>
</html>
