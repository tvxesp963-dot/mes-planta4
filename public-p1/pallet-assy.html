<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Salida de Pallet · TC</title>
<style>
  :root{--bg:#0f1117;--card:#171a23;--card2:#1e2230;--border:#2a2f3d;--text:#e8eaf0;--muted:#8a90a3;--blue:#4f8ef7;--green:#2ecc71;--red:#e74c3c;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .wrap{width:100%;max-width:420px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px;font-size:15px;}
  input:focus,select:focus{outline:none;border-color:var(--blue);}
  button{width:100%;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;}
  .btn-primary{background:var(--blue);color:#fff;} .btn-primary:disabled{opacity:.5;}
  .btn-logout{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:8px;font-weight:400;font-size:13px;padding:8px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;color:#fff;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;}
  .badge{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .badge b{color:var(--text);}
  .row2{display:flex;gap:10px;} .row2>div{flex:1;}
  .hist{margin-top:16px;border-top:1px solid var(--border);padding-top:12px;}
  .hist-item{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);}
  .err{color:var(--red);font-size:13px;margin-top:10px;display:none;}
  .hide{display:none !important;}
  .link{color:var(--blue);font-size:13px;text-align:center;margin-top:14px;cursor:pointer;}
  .langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px;}
  .langs button{width:auto;margin:0;padding:3px;border-radius:5px;border:2px solid transparent;background:transparent;opacity:.55;line-height:0;}
  .langs button.on{border-color:var(--blue);opacity:1;}
  .langs img{width:28px;height:19px;border-radius:3px;object-fit:cover;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="view-login" class="card">
    <div class="langs"></div>
    <h1>🔒 <span data-i18n="title"></span></h1>
    <div class="sub" data-i18n="loginSub"></div>
    <label data-i18n="email"></label>
    <input type="email" id="lg-email" autocomplete="username">
    <label data-i18n="pass"></label>
    <input type="password" id="lg-pass" autocomplete="current-password">
    <button class="btn-primary" id="btn-login" onclick="doLogin()"></button>
    <div class="err" id="lg-err"></div>
    <div class="link" onclick="abrirReset()" data-i18n="forgot"></div>
  </div>

  <div id="view-form" class="card hide">
    <div class="langs"></div>
    <h1>📦 <span data-i18n="title"></span></h1>
    <div class="sub"><span data-i18n="machine"></span> TC · <span id="op-name">—</span></div>

    <div class="badge">⏰ <span data-i18n="cutDetected"></span>: <b id="corte-auto">—</b> &nbsp;|&nbsp; 🎯 <span data-i18n="target"></span>: <b id="corte-target">—</b></div>

    <label data-i18n="shift"></label>
    <select id="ip-turno">
      <option value="A" data-i18n="shiftA"></option>
      <option value="B" data-i18n="shiftB"></option>
      <option value="C" data-i18n="shiftC"></option>
    </select>

    <label data-i18n="model"></label>
    <input id="ip-modelo" placeholder="SM-S936" autocapitalize="characters" list="dl-modelos">
    <datalist id="dl-modelos"></datalist>

    <label data-i18n="part"></label>
    <input id="ip-parte" placeholder="GH90-12345A" autocapitalize="characters" list="dl-partes">
    <datalist id="dl-partes"></datalist>

    <label data-i18n="qty"></label>
    <input type="number" id="ip-qty" placeholder="500" min="1">

    <div class="row2">
      <div><label data-i18n="defects"></label><input type="number" id="ip-def" value="0" min="0"></div>
      <div><label data-i18n="scrap"></label><input type="number" id="ip-scrap" value="0" min="0"></div>
    </div>

    <label data-i18n="shipType"></label>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button type="button" id="tp-plan" onclick="setTipoEnvio('PLAN')" style="flex:1;padding:12px 8px;font-size:13px;margin-top:0">📦 <span data-i18n="normal"></span></button>
      <button type="button" id="tp-remplazo" onclick="setTipoEnvio('REMPLAZO')" style="flex:1;padding:12px 8px;font-size:13px;margin-top:0">⚠️ <span data-i18n="replacement"></span></button>
    </div>
    <div style="font-size:11.5px;color:var(--muted)" data-i18n="replNote"></div>

    <button class="btn-primary" id="btn-guardar" onclick="guardarPallet()"></button>
    <button class="btn-logout" onclick="doLogout()" data-i18n="logout"></button>
    <div class="err" id="fm-err"></div>

    <div class="hist">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px" data-i18n="histTitle"></div>
      <div id="hist-list"></div>
    </div>
  </div>
</div>

<div class="overlay hide" id="reset-ov">
  <div class="card" style="width:100%;max-width:380px">
    <h1 data-i18n="resetTitle"></h1>
    <label data-i18n="email"></label>
    <input type="email" id="rs-email">
    <div class="err" id="rs-msg" style="display:block"></div>
    <button class="btn-primary" onclick="enviarReset()" data-i18n="send"></button>
    <button class="btn-logout" onclick="cerrarReset()" data-i18n="close"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

let lang='es';
try{ lang=localStorage.getItem('mes-lang')||'es'; }catch(e){}
if(!I18N[lang]) lang='es';
const t=(k,v)=>{ let s=(I18N[lang]&&I18N[lang][k])||I18N.es[k]||k; if(v) for(const x in v) s=s.split('{'+x+'}').join(v[x]); return s; };
const FLAGS={es:"mx",en:"us",ko:"kr"};
function pintarBanderas(){
  document.querySelectorAll('.langs').forEach(box=>{
    box.innerHTML=Object.keys(FLAGS).map(l=>`<button type="button" class="${l===lang?'on':''}" onclick="setLang('${l}')"><img src="https://flagcdn.com/w40/${FLAGS[l]}.png" alt="${l}"></button>`).join('');
  });
}
window.setLang=(l)=>{ lang=l; try{localStorage.setItem('mes-lang',l);}catch(e){} aplicarIdioma(); };
function aplicarIdioma(){
  document.documentElement.lang=lang;
  document.title=t('title')+' · TC';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  pintarBanderas(); renderHistorial();
  document.getElementById('btn-guardar').textContent=t('save');
  document.getElementById('btn-login').textContent=t('enter');
  setTipoEnvio(tipoEnvio);
}

/* Máquina TC de MES P1 (posición 19 en MAQUINAS del index.html) */
const MAQUINA={ idx:19, nombre:"TC", tipo:"DieCut", target:8000, cortes:{C1:1600,C2:3200,C3:3200,OT:2000} };
const RANGOS=[{id:"C1",finH:8,finM:45},{id:"C2",finH:12,finM:30},{id:"C3",finH:16,finM:30},{id:"OT",finH:18,finM:25}];
function corteActual(){
  const n=new Date(); const mins=n.getHours()*60+n.getMinutes();
  for(const r of RANGOS){ if(mins<=r.finH*60+r.finM) return r.id; }
  return "OT";
}
function hoyStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let CURRENT_USER=null, corteHoy=null, tipoEnvio='PLAN', misPallets=[];

window.setTipoEnvio=(tipo)=>{
  tipoEnvio=tipo;
  const p=document.getElementById('tp-plan'), r=document.getElementById('tp-remplazo'), esPlan=tipo==='PLAN';
  p.style.background=esPlan?'rgba(46,204,113,.18)':'transparent';
  p.style.border=esPlan?'2px solid var(--green)':'2px solid var(--border)';
  p.style.color=esPlan?'var(--green)':'var(--muted)';
  r.style.background=!esPlan?'rgba(230,126,34,.18)':'transparent';
  r.style.border=!esPlan?'2px solid #e67e22':'2px solid var(--border)';
  r.style.color=!esPlan?'#e67e22':'var(--muted)';
};

window.doLogin=async()=>{
  const email=document.getElementById("lg-email").value.trim(), pass=document.getElementById("lg-pass").value;
  const errEl=document.getElementById("lg-err"); errEl.style.display="none";
  if(!email||!pass){ errEl.textContent=t('errFields'); errEl.style.display="block"; return; }
  const btn=document.getElementById("btn-login"); btn.disabled=true; btn.textContent=t('entering');
  try{ await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ errEl.textContent=t('errCreds'); errEl.style.display="block"; }
  btn.disabled=false; btn.textContent=t('enter');
};
window.doLogout=async()=>{ await signOut(auth); };

window.abrirReset=()=>{ document.getElementById('rs-email').value=document.getElementById('lg-email').value; document.getElementById('rs-msg').textContent=''; document.getElementById('reset-ov').classList.remove('hide'); };
window.cerrarReset=()=>document.getElementById('reset-ov').classList.add('hide');
window.enviarReset=async()=>{
  const email=document.getElementById('rs-email').value.trim(), m=document.getElementById('rs-msg');
  if(!email){ m.style.color='var(--red)'; m.textContent=t('resetNo'); return; }
  try{ await sendPasswordResetEmail(auth,email); m.style.color='var(--green)'; m.textContent=t('resetOk'); }
  catch(e){ m.style.color='var(--red)'; m.textContent=t('resetErr'); }
};

onAuthStateChanged(auth,async(fireUser)=>{
  if(!fireUser){
    CURRENT_USER=null;
    document.getElementById("view-login").classList.remove("hide");
    document.getElementById("view-form").classList.add("hide");
    return;
  }
  const snap=await getDocs(query(USERS_COL(),where("uid","==",fireUser.uid)));
  if(snap.empty){ showToast(t('notReg'),"var(--red)"); await signOut(auth); return; }
  CURRENT_USER={uid:fireUser.uid,email:fireUser.email,...snap.docs[0].data()};
  document.getElementById("op-name").textContent=CURRENT_USER.nombre||CURRENT_USER.email;
  document.getElementById("view-login").classList.add("hide");
  document.getElementById("view-form").classList.remove("hide");
  refrescarCorte(); setTipoEnvio('PLAN');
  await cargarHistorial();
  aplicarIdioma();
});

function refrescarCorte(){
  corteHoy=corteActual();
  document.getElementById("corte-auto").textContent=corteHoy;
  document.getElementById("corte-target").textContent=MAQUINA.cortes[corteHoy].toLocaleString();
}
setInterval(refrescarCorte,60000);


/* ───────── Partes P1: BOM (filas P1) + catálogo propio ───────── */
let PARTES_P1 = [];
async function cargarPartesP1(){
  const mapa = {};
  try {
    const b = await getDoc(doc(db,'bom_simulator_p4','bom_activo'));
    if (b.exists()){
      const bom = JSON.parse(b.data().bom || '[]');
      let filas = bom.filter(r=>r.pn && r.sm && /P-?1\b|PLANTA\s*1/i.test(String(r.planta||'')));
      if (!filas.length) filas = bom.filter(r=>r.pn && r.sm);
      filas.forEach(r=>{ const pn=String(r.pn).trim().toUpperCase(); if(!mapa[pn]) mapa[pn]={pn, modelo:String(r.sm).trim().toUpperCase(), desc:r.desc||''}; });
    }
  } catch(e){ console.warn('BOM:', e); }
  try {
    const c = await getDocs(collection(db,'catalogo_partes_p1'));
    c.docs.forEach(d=>{ const x=d.data(); const pn=String(x.parte||d.id).toUpperCase(); const ds=String(x.descripcion||'').toUpperCase(); mapa[pn]={pn, modelo:ds, desc:ds}; });
  } catch(e){ console.warn('Catálogo P1:', e); }
  PARTES_P1 = Object.values(mapa).sort((a,b)=>a.pn.localeCompare(b.pn));
  const dlP = document.getElementById('dl-partes'), dlM = document.getElementById('dl-modelos');
  if (dlP) dlP.innerHTML = PARTES_P1.map(p=>`<option value="${p.pn}">${String(p.modelo||'').replace(/"/g,'')}</option>`).join('');
  if (dlM) dlM.innerHTML = [...new Set(PARTES_P1.map(p=>p.modelo).filter(Boolean))].sort().map(m=>`<option value="${m}">`).join('');
}

document.addEventListener('input',(e)=>{
  if(e.target && e.target.id==='ip-parte'){
    const pn=e.target.value.trim().toUpperCase(), m=document.getElementById('ip-modelo');
    const p=PARTES_P1.find(x=>x.pn===pn);
    if(p && m && !m.value.trim()) m.value=p.modelo;
  }
});
async function cargarHistorial(){
  try{
    const snap=await getDocs(query(REGS_COL(),where("fecha","==",hoyStr()),where("maqIdx","==",MAQUINA.idx)));
    const todos=snap.docs.map(d=>d.data());
    misPallets=todos.filter(r=>r.corte===corteHoy&&r.origen==="pallet_assy");
    // sugerencias de modelo/parte según lo ya registrado hoy en TC
    await cargarPartesP1();
  }catch(e){ console.warn(e); misPallets=[]; }
  renderHistorial();
}
function renderHistorial(){
  const list=document.getElementById("hist-list"); if(!list) return;
  list.innerHTML=misPallets.length
    ? misPallets.map(r=>`<div class="hist-item"><span>${esc(r.modelo||"—")} · ${esc(r.parte||"—")}${r.esRemplazo?` <span style="color:#e67e22;font-weight:700">⚠ ${t('replacement')}</span>`:''}</span><span style="color:var(--muted)">${(r.prod||0).toLocaleString()} ${t('pcs')}</span></div>`).join("")
    : `<div style="color:var(--muted);font-size:13px">${t('histEmpty')}</div>`;
}
function showToast(msg,color){
  const el=document.getElementById("toast"); el.textContent=msg; el.style.background=color; el.style.opacity="1";
  setTimeout(()=>{ el.style.opacity="0"; },3200);
}

window.guardarPallet=async()=>{
  const errEl=document.getElementById("fm-err"); errEl.style.display="none";
  const turno=document.getElementById("ip-turno").value;
  const modelo=document.getElementById("ip-modelo").value.trim().toUpperCase();
  const parte=document.getElementById("ip-parte").value.trim().toUpperCase();
  const qty=parseInt(document.getElementById("ip-qty").value)||0;
  const def=parseInt(document.getElementById("ip-def").value)||0;
  const scrap=parseInt(document.getElementById("ip-scrap").value)||0;
  const esRemplazo=tipoEnvio==='REMPLAZO';
  if(!modelo){ errEl.textContent=t('errModel'); errEl.style.display="block"; return; }
  if(!parte){ errEl.textContent=t('errPart'); errEl.style.display="block"; return; }
  if(qty<=0){ errEl.textContent=t('errQty'); errEl.style.display="block"; return; }
  if(!esRemplazo && !parte.startsWith("GH90")){ if(!window.confirm(t('warnGH'))) return; }

  refrescarCorte();
  const target=MAQUINA.cortes[corteHoy]||MAQUINA.target;
  const btn=document.getElementById("btn-guardar"); btn.disabled=true; btn.textContent=t('saving');
  const reg={
    userId:CURRENT_USER.uid, operador:CURRENT_USER.nombre||"", empleado:CURRENT_USER.empleado||"",
    modelo, parte, fecha:hoyStr(), turno, corte:corteHoy,
    maqIdx:MAQUINA.idx, maqNombre:MAQUINA.nombre, maqTipo:MAQUINA.tipo, target,
    prod:qty, def, scrap,
    pct:target>0?+(qty/target*100).toFixed(2):0,
    defPct:qty>0?+(def/qty*100).toFixed(2):0,
    scrapPct:qty>0?+(scrap/qty*100).toFixed(2):0,
    notas:"Registrado desde Salida de Pallet (TC)",
    origen:"pallet_assy", esRemplazo, causaParo:"", minParo:0,
    tsLocal:new Date().toISOString(), ts:serverTimestamp(),
  };
  try{
    await addDoc(REGS_COL(),reg);
    showToast(t('savedOk',{q:qty.toLocaleString(),c:corteHoy}),"var(--green)");
    document.getElementById("ip-qty").value=""; document.getElementById("ip-def").value="0"; document.getElementById("ip-scrap").value="0";
    setTipoEnvio('PLAN');
    misPallets.push(reg); renderHistorial();
  }catch(e){ errEl.textContent=t('errSave')+e.message; errEl.style.display="block"; }
  btn.disabled=false; btn.textContent=t('save');
};

aplicarIdioma();
</script>
</body>
</html>
