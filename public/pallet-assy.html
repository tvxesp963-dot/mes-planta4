<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Salida de Pallet · ASSY</title>
<style>
  :root{--bg:#0f1117;--card:#171a23;--card2:#1e2230;--border:#2a2f3d;--text:#e8eaf0;--muted:#8a90a3;
    --blue:#4f8ef7;--green:#2ecc71;--red:#e74c3c;--yellow:#f1c40f;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .wrap{width:100%;max-width:420px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;}
  h1{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:11px;font-size:15px;}
  input:focus,select:focus{outline:none;border-color:var(--blue);}
  button{width:100%;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;
    cursor:pointer;margin-top:18px;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ok{background:var(--green);color:#06210f;}
  .btn-logout{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:8px;font-weight:400;font-size:13px;padding:8px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:8px;
    font-size:14px;font-weight:600;color:#fff;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);
    border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .badge b{color:var(--text);}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .hist{margin-top:16px;border-top:1px solid var(--border);padding-top:12px;}
  .hist-item{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border);}
  .hist-item:last-child{border-bottom:none;}
  .err{color:var(--red);font-size:13px;margin-top:10px;display:none;}
  .hide{display:none !important;}
  /* Selector de idioma */
  .langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px;}
  .langs button{width:auto;margin:0;padding:3px;border-radius:5px;border:2px solid transparent;background:transparent;opacity:.55;line-height:0;}
  .langs button.on{border-color:var(--blue);opacity:1;}
  .langs img{width:28px;height:19px;border-radius:3px;object-fit:cover;}
  /* Bloque Modelo en línea */
  .linea{border-radius:10px;padding:11px 12px;margin-bottom:6px;font-size:13px;}
  .linea.warn{background:rgba(241,196,15,.12);border:2px solid var(--yellow);}
  .linea.ok{background:rgba(46,204,113,.12);border:2px solid var(--green);}
  .linea b{font-size:16px;display:block;margin:3px 0;}
  .linea small{color:var(--muted);}
  /* Ventana para elegir modelo */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px;}
  .pick{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:92vh;overflow:auto;}
  .opt{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer;}
  .opt.sel{border-color:var(--green);background:rgba(46,204,113,.12);}
  .opt .n{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;}
  .opt.wait{opacity:.6;} .opt.wait .n{background:#5c6678;}
  .opt .m{font-weight:700;font-size:14px;} .opt .d{font-size:11px;color:var(--muted);}
  .tag{font-size:10px;background:var(--green);color:#06210f;border-radius:4px;padding:1px 6px;font-weight:800;margin-left:6px;}
</style>
</head>
<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="view-login" class="card">
    <div class="langs"></div>
    <h1>🔒 <span data-i18n="title"></span></h1>
    <div class="sub" data-i18n="loginSub"></div>
    <label data-i18n="email"></label>
    <input type="email" id="lg-email" autocomplete="username">
    <label data-i18n="pass"></label>
    <input type="password" id="lg-pass" autocomplete="current-password">
    <button class="btn-primary" id="btn-login" onclick="doLogin()" data-i18n="enter"></button>
    <div class="err" id="lg-err"></div>
  </div>

  <!-- FORMULARIO -->
  <div id="view-form" class="card hide">
    <div class="langs"></div>
    <h1>📦 <span data-i18n="title"></span></h1>
    <div class="sub"><span data-i18n="machine"></span> ASSY1 · <span id="op-name">—</span></div>

    <!-- 1) MODELO EN LÍNEA: se confirma ANTES de arrancar; Piso lo muestra al instante -->
    <div id="linea-box"></div>
    <button type="button" id="btn-linea" class="btn-primary" style="margin-top:8px" onclick="abrirPicker()"></button>

    <div class="badge" style="margin-top:14px">⏰ <span data-i18n="cutDetected"></span>: <b id="corte-auto">—</b> &nbsp;|&nbsp; 🎯 <span data-i18n="target"></span>: <b id="corte-target">—</b></div>

    <label data-i18n="shift"></label>
    <select id="ip-turno">
      <option value="A" data-i18n="shiftA"></option>
      <option value="B" data-i18n="shiftB"></option>
      <option value="C" data-i18n="shiftC"></option>
    </select>

    <!-- 2) REGISTRO DEL PALLET (igual que antes) -->
    <label data-i18n="model"></label>
    <select id="ip-modelo" onchange="onModeloChange()"></select>

    <label data-i18n="part"></label>
    <select id="ip-parte"></select>

    <label data-i18n="qty"></label>
    <input type="number" id="ip-qty" placeholder="500" min="1">

    <div class="row2">
      <div>
        <label data-i18n="defects"></label>
        <input type="number" id="ip-def" value="0" min="0">
      </div>
      <div>
        <label data-i18n="scrap"></label>
        <input type="number" id="ip-scrap" value="0" min="0">
      </div>
    </div>

    <label data-i18n="shipType"></label>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button type="button" id="tp-plan" onclick="setTipoEnvio('PLAN')" style="flex:1;padding:12px 8px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;background:rgba(46,204,113,.18);border:2px solid var(--green);color:var(--green);margin-top:0">📦 <span data-i18n="normal"></span></button>
      <button type="button" id="tp-remplazo" onclick="setTipoEnvio('REMPLAZO')" style="flex:1;padding:12px 8px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;background:transparent;border:2px solid var(--border);color:var(--muted);margin-top:0">⚠️ <span data-i18n="replacement"></span></button>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:4px" data-i18n="replNote"></div>

    <button class="btn-primary" id="btn-guardar" onclick="guardarPallet()"></button>
    <button class="btn-logout" onclick="doLogout()" data-i18n="logout"></button>
    <div class="err" id="fm-err"></div>

    <div class="hist" id="hist-wrap">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px" data-i18n="histTitle"></div>
      <div id="hist-list"></div>
    </div>
  </div>

</div>

<!-- VENTANA: elegir el modelo que va a correr -->
<div class="overlay hide" id="pick-ov">
  <div class="pick">
    <h1>▶ <span data-i18n="pickTitle"></span></h1>
    <div class="sub" data-i18n="pickSub"></div>
    <div id="pick-list"></div>
    <label data-i18n="otherModel"></label>
    <select id="pick-otro" onchange="elegirOtro()"></select>
    <button class="btn-ok" id="pick-ok" onclick="confirmarPicker()"></button>
    <button class="btn-logout" onclick="terminarCorrida()" data-i18n="endRun"></button>
    <button class="btn-logout" onclick="cerrarPicker()" data-i18n="cancel"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

if(!I18N[lang]) lang = 'es';
const t = (k, v) => {
  let s = (I18N[lang] && I18N[lang][k]) || I18N.es[k] || k;
  if(v) for(const x in v) s = s.split('{'+x+'}').join(v[x]);
  return s;
};
const FLAGS = { es:"mx", en:"us", ko:"kr" };
function pintarBanderas(){
  document.querySelectorAll('.langs').forEach(box=>{
    box.innerHTML = Object.keys(FLAGS).map(l =>
      `<button type="button" class="${l===lang?'on':''}" onclick="setLang('${l}')" title="${l.toUpperCase()}"><img src="https://flagcdn.com/w40/${FLAGS[l]}.png" alt="${l.toUpperCase()}"></button>`).join('');
  });
}
window.setLang = (l) => {
  lang = l;
  try { localStorage.setItem('palletLang', l); } catch(e){}
  aplicarIdioma();
};
function aplicarIdioma(){
  document.documentElement.lang = lang;
  document.title = t('title') + ' · ASSY';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  pintarBanderas();
  llenarModelos();
  llenarPartes();
  renderLinea();
  renderHistorial();
  renderPicker();
  const bg = document.getElementById('btn-guardar');
  if(!bg.disabled || bg.textContent !== t('saving')) bg.textContent = t('save');
  const bl = document.getElementById('btn-login');
  if(!bl.disabled) bl.textContent = t('enter');
}

  { id:"C2", finH:12, finM:30 },
  { id:"C3", finH:16, finM:30 },
  { id:"OT", finH:18, finM:25 },
];
function corteActual(){
  const n = new Date();
  const mins = n.getHours()*60 + n.getMinutes();
  for(const r of RANGOS){
    if(mins <= r.finH*60+r.finM) return r.id;
  }
  return "OT"; // después de las 6:25pm, se sigue contando como OT
}
function hoyStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const btnPlan = document.getElementById('tp-plan');
  const btnRemplazo = document.getElementById('tp-remplazo');
  const esPlan = tipo === 'PLAN';
  btnPlan.style.background = esPlan ? 'rgba(46,204,113,.18)' : 'transparent';
  btnPlan.style.border = esPlan ? '2px solid var(--green)' : '2px solid var(--border)';
  btnPlan.style.color = esPlan ? 'var(--green)' : 'var(--muted)';
  btnRemplazo.style.background = !esPlan ? 'rgba(230,126,34,.18)' : 'transparent';
  btnRemplazo.style.border = !esPlan ? '2px solid #e67e22' : '2px solid var(--border)';
  btnRemplazo.style.color = !esPlan ? '#e67e22' : 'var(--muted)';
};

async function cargarBOM(){
  try{
    const bomDoc = await getDoc(doc(db,'bom_simulator_p4','bom_activo'));
    if(!bomDoc.exists()){ BOM_ACTIVO=[]; MODELOS_BOM=[]; llenarModelos(); return; }
    BOM_ACTIVO = JSON.parse(bomDoc.data().bom || '[]');
    MODELOS_BOM = [...new Set(BOM_ACTIVO.map(r=>r.sm).filter(Boolean))].sort();
    llenarModelos();
  }catch(e){
    BOM_ACTIVO=[]; MODELOS_BOM=[];
    llenarModelos();
    showToast(t('bomErr'), "var(--red)");
  }
}

function llenarModelos(){
  const sel = document.getElementById("ip-modelo");
  const actual = sel.value;
  sel.innerHTML = `<option value="">${t('selModel')}</option>` +
    MODELOS_BOM.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");
  if(actual && MODELOS_BOM.includes(actual)) sel.value = actual;
}

function llenarPartes(seleccion){
  const modelo = document.getElementById("ip-modelo").value.trim();
  const selParte = document.getElementById("ip-parte");
  const actual = seleccion || selParte.value;
  if(!modelo){
    selParte.innerHTML = `<option value="">${t('selPart')}</option>`;
    return;
  }
  const partes = [...new Set(BOM_ACTIVO.filter(b=>b.pn && b.sm && b.sm.trim()===modelo).map(b=>b.pn.trim().toUpperCase()))].sort();
  if(!partes.length){
    selParte.innerHTML = `<option value="">${t('noParts')}</option>`;
    return;
  }
  selParte.innerHTML = `<option value="">${t('selPart')}</option>` +
    partes.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
  if(actual && partes.includes(actual.toUpperCase())) selParte.value = actual.toUpperCase();
  else if(partes.length === 1) selParte.value = partes[0];   // si solo hay una parte, ya viene elegida
}

window.onModeloChange = () => { llenarPartes(); };

window.doLogin = async () => {
  const email = document.getElementById("lg-email").value.trim();
  const pass  = document.getElementById("lg-pass").value;
  const errEl = document.getElementById("lg-err");
  errEl.style.display = "none";
  if(!email || !pass){ errEl.textContent=t('errFields'); errEl.style.display="block"; return; }
  const btn = document.getElementById("btn-login");
  btn.disabled = true; btn.textContent = t('entering');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    errEl.textContent = t('errCreds');
    errEl.style.display = "block";
  }
  btn.disabled = false; btn.textContent = t('enter');
};

window.doLogout = async () => { await signOut(auth); };

onAuthStateChanged(auth, async (fireUser) => {
  if(!fireUser){
    CURRENT_USER = null;
    if(unsubLinea){ unsubLinea(); unsubLinea = null; }
    LINEA = null;
    document.getElementById("view-login").classList.remove("hide");
    document.getElementById("view-form").classList.add("hide");
    return;
  }
  const q = query(USERS_COL(), where("uid","==",fireUser.uid));
  const snap = await getDocs(q);
  if(snap.empty){
    showToast(t('notReg'), "var(--red)");
    await signOut(auth);
    return;
  }
  CURRENT_USER = { uid: fireUser.uid, email: fireUser.email, ...snap.docs[0].data() };
  document.getElementById("op-name").textContent = CURRENT_USER.nombre || CURRENT_USER.email;
  document.getElementById("view-login").classList.add("hide");
  document.getElementById("view-form").classList.remove("hide");
  refrescarCorte();
  setTipoEnvio('PLAN');
  await cargarBOM();
  escucharLinea();
  await cargarHistorial();
  aplicarIdioma();
});

function refrescarCorte(){
  corteHoy = corteActual();
  document.getElementById("corte-auto").textContent = corteHoy;
  document.getElementById("corte-target").textContent = MAQUINA.cortes[corteHoy].toLocaleString();
}
setInterval(refrescarCorte, 60000);

// ===== MODELO EN LÍNEA (confirmado por el operador) =====
function lineaVigente(d){
  if(!d || !d.sm || !d.ts) return null;
  if(Date.now() - d.ts > HORAS_CONF*36e5) return null;
  return d;
}
function escucharLinea(){
  if(unsubLinea) unsubLinea();
  unsubLinea = onSnapshot(LINEA_DOC(), (snap)=>{
    const previo = LINEA && LINEA.sm;
    LINEA = lineaVigente(snap.exists() ? snap.data() : null);
    renderLinea();
    // Al confirmar (en esta u otra tablet) el formulario queda con ese modelo y su parte
    if(LINEA && LINEA.sm !== previo) precargarFormulario();
  }, (e)=>{ console.warn('No se pudo leer el modelo en línea:', e); });
}
setInterval(()=>{ if(LINEA){ LINEA = lineaVigente(LINEA); renderLinea(); } }, 60000);

function precargarFormulario(){
  if(!LINEA) return;
  const sel = document.getElementById("ip-modelo");
  if(!MODELOS_BOM.includes(LINEA.sm)){
    // El modelo no está en el BOM activo: se agrega para poder elegirlo igual
    MODELOS_BOM.push(LINEA.sm); MODELOS_BOM.sort(); llenarModelos();
  }
  sel.value = LINEA.sm;
  llenarPartes((LINEA.code || '').toUpperCase());
}

function renderLinea(){
  const box = document.getElementById('linea-box');
  const btn = document.getElementById('btn-linea');
  if(!box) return;
  if(LINEA){
    box.innerHTML = `<div class="linea ok">${t('lineRunning')}<b>${esc(LINEA.sm)}</b><small>${t('confirmedBy',{n:esc(LINEA.por||'—'), h:hora(LINEA.ts)})}</small></div>`;
    btn.textContent = t('changeModel');
    btn.className = 'btn-logout';
    btn.style.marginTop = '0';
  } else {
    box.innerHTML = `<div class="linea warn">${t('lineNone')}<b>${t('unconfirmed')}</b><small>${t('unconfirmedMsg')}</small></div>`;
    btn.textContent = t('startModel');
    btn.className = 'btn-primary';
    btn.style.marginTop = '8px';
  }
}

async function cargarPlan(){
  PLAN_MODELOS = [];
  try{
    const d = await getDoc(doc(db,'bom_simulator_p4','plan_piso'));
    if(d.exists() && Array.isArray(d.data().modelos)) PLAN_MODELOS = d.data().modelos.filter(m=>m && m.sm);
  }catch(e){ console.warn('No se pudo leer el plan:', e); }
}

window.abrirPicker = async () => {
  pickSel = LINEA ? { sm: LINEA.sm, code: LINEA.code || '' } : null;
  await cargarPlan();
  // Si no hay confirmación, el primero de la fila queda sugerido
  const { run } = listasPlan();
  if(!pickSel && run.length) pickSel = { sm: run[0].sm, code: run[0].code || '' };
  document.getElementById('pick-ov').classList.remove('hide');
  renderPicker();
};
window.cerrarPicker = () => { document.getElementById('pick-ov').classList.add('hide'); };

function listasPlan(){
  const pend = (m) => Math.max(0, (m.target||0) - (m.producido||0));
  const run  = PLAN_MODELOS.filter(m=>m.orden && pend(m)>0).sort((a,b)=>a.orden-b.orden);
  const wait = PLAN_MODELOS.filter(m=>!m.orden && pend(m)>0).sort((a,b)=>(a.prioridad||999)-(b.prioridad||999));
  return { run, wait, pend };
}

function renderPicker(){
  const ov = document.getElementById('pick-ov');
  if(!ov || ov.classList.contains('hide')) return;
  const { run, wait, pend } = listasPlan();
  const list = document.getElementById('pick-list');
  const fila = (m, i, esRun) => {
    const sel = pickSel && pickSel.sm === m.sm;
    const faltan = ['Strip','Top','Bot','Bundle'].filter(k=>m.materiales && m.materiales[k]===false);
    const detalle = esRun
      ? `${esc(m.code||'')} · ${t('pend')} ${pend(m).toLocaleString()} · ${t('ready')} ${Math.min(m.cap||0, pend(m)).toLocaleString()}`
      : `${esc(m.code||'')} · ${t('missing')}${faltan.length?': '+faltan.join(', '):''}`;
    return `<div class="opt ${esRun?'':'wait'} ${sel?'sel':''}" onclick="elegirModelo(${JSON.stringify(m.sm).replace(/"/g,'&quot;')}, ${JSON.stringify(m.code||'').replace(/"/g,'&quot;')})">
      <div class="n">${esRun ? i+1 : '⏳'}</div>
      <div><div class="m">${esc(m.sm)}${esRun && i===0 ? `<span class="tag">${t('suggested')}</span>` : ''}</div><div class="d">${detalle}</div></div></div>`;
  };
  list.innerHTML = (run.length || wait.length)
    ? run.map((m,i)=>fila(m,i,true)).join('') + wait.map((m,i)=>fila(m,i,false)).join('')
    : `<div style="color:var(--muted);font-size:13px;margin-bottom:8px">${t('noPlan')}</div>`;
  // Lista de "otro modelo" (todos los del BOM)
  const otro = document.getElementById('pick-otro');
  otro.innerHTML = `<option value="">${t('selOther')}</option>` + MODELOS_BOM.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  if(pickSel && !PLAN_MODELOS.some(m=>m.sm===pickSel.sm) && MODELOS_BOM.includes(pickSel.sm)) otro.value = pickSel.sm;
  const ok = document.getElementById('pick-ok');
  ok.textContent = pickSel ? t('confirm',{m:pickSel.sm}) : t('chooseFirst');
  ok.disabled = !pickSel;
  ok.style.opacity = pickSel ? '1' : '.5';
}
window.elegirModelo = (sm, code) => { pickSel = { sm, code }; renderPicker(); };
window.elegirOtro = () => {
  const v = document.getElementById('pick-otro').value;
  if(!v) return;
  const dePlan = PLAN_MODELOS.find(m=>m.sm===v);
  pickSel = { sm: v, code: dePlan ? (dePlan.code||'') : '' };
  renderPicker();
};

async function guardarLinea(sm, code){
  const data = {
    maq: MAQUINA.nombre, sm: sm || '', code: code || '',
    por: (CURRENT_USER && (CURRENT_USER.nombre || CURRENT_USER.email)) || '',
    empleado: (CURRENT_USER && CURRENT_USER.empleado) || '',
    userId: CURRENT_USER ? CURRENT_USER.uid : '',
    ts: Date.now(), tsServer: serverTimestamp()
  };
  try{
    await setDoc(LINEA_DOC(), data);
    return true;
  }catch(e){
    console.warn('Error guardando modelo en línea:', e);
    showToast(t('errPerm'), "var(--red)");
    return false;
  }
}

window.confirmarPicker = async () => {
  if(!pickSel) return;
  const { sm, code } = pickSel;
  if(await guardarLinea(sm, code)){
    cerrarPicker();
    showToast(t('confirmOk',{m:sm}), "var(--green)");
  }
};
window.terminarCorrida = async () => {
  if(await guardarLinea('', '')){
    cerrarPicker();
    showToast(t('endOk'), "var(--blue)");
  }
};

async function cargarHistorial(){
  const HOY = hoyStr();
  const q = query(REGS_COL(), where("fecha","==",HOY), where("maqIdx","==",MAQUINA.idx));
  const snap = await getDocs(q);
  window._misPalletsHoy = snap.docs.map(d=>d.data()).filter(r=>r.corte===corteHoy);
  renderHistorial();
}

function renderHistorial(){
  const list = document.getElementById("hist-list");
  if(!list) return;
  if(!window._misPalletsHoy.length){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px">${t('histEmpty')}</div>`;
    return;
  }
  list.innerHTML = window._misPalletsHoy.map(r=>`
    <div class="hist-item">
      <span>${esc(r.modelo||"—")} · ${esc(r.parte||"—")}${r.esRemplazo?` <span style="color:#e67e22;font-weight:700">⚠ ${t('replacement')}</span>`:''}</span>
      <span style="color:var(--muted)">${(r.prod||0).toLocaleString()} ${t('pcs')}</span>
    </div>`).join("");
}

function showToast(msg, color){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.background = color; el.style.opacity = "1";
  setTimeout(()=>{ el.style.opacity = "0"; }, 3200);
}

window.guardarPallet = async () => {
  const errEl = document.getElementById("fm-err");
  errEl.style.display = "none";

  const turno  = document.getElementById("ip-turno").value;
  const modelo = document.getElementById("ip-modelo").value.trim().toUpperCase();
  const parte  = document.getElementById("ip-parte").value.trim().toUpperCase();
  const qty    = parseInt(document.getElementById("ip-qty").value) || 0;
  const def    = parseInt(document.getElementById("ip-def").value) || 0;
  const scrap  = parseInt(document.getElementById("ip-scrap").value) || 0;
  const esRemplazo = tipoEnvio === 'REMPLAZO';

  // Primero hay que confirmar el modelo que se va a correr
  if(!LINEA){ errEl.textContent=t('mustConfirm'); errEl.style.display="block"; return; }
  if(!modelo){ errEl.textContent=t('errModel'); errEl.style.display="block"; return; }
  if(!parte){ errEl.textContent=t('errPart'); errEl.style.display="block"; return; }
  if(qty<=0){ errEl.textContent=t('errQty'); errEl.style.display="block"; return; }

  // Si registra un modelo distinto al confirmado, se le pregunta si cambió de modelo
  // (un Remplazo puede ser de otro modelo/parte sin que eso cambie la corrida: no pregunta)
  if(!esRemplazo && modelo !== (LINEA.sm||'').toUpperCase()){
    if(!window.confirm(t('changedAsk',{a:LINEA.sm, b:modelo}))) return;
    if(!(await guardarLinea(document.getElementById("ip-modelo").value.trim(), parte))) return;
  }

  refrescarCorte(); // por si cambió el corte mientras llenaba el formulario
  const target = MAQUINA.cortes[corteHoy] || MAQUINA.target;

  const btn = document.getElementById("btn-guardar");
  btn.disabled = true; btn.textContent = t('saving');

  const reg = {
    userId: CURRENT_USER.uid,
    operador: CURRENT_USER.nombre || "",
    empleado: CURRENT_USER.empleado || "",
    modelo, parte,
    fecha: hoyStr(),
    turno,
    corte: corteHoy,
    maqIdx: MAQUINA.idx, maqNombre: MAQUINA.nombre, maqTipo: MAQUINA.tipo,
    target,
    prod: qty, def, scrap,
    pct: target>0 ? +(qty/target*100).toFixed(2) : 0,
    defPct: qty>0 ? +(def/qty*100).toFixed(2) : 0,
    scrapPct: qty>0 ? +(scrap/qty*100).toFixed(2) : 0,
    notas: "Registrado desde Salida de Pallet (ASSY)",
    origen: "pallet_assy",
    esRemplazo,
    causaParo: "", minParo: 0,
    tsLocal: new Date().toISOString(),
    ts: serverTimestamp(),
  };

  try {
    await addDoc(REGS_COL(), reg);
    showToast(t('savedOk',{q:qty.toLocaleString(), c:corteHoy}), "var(--green)");
    // El modelo sigue siendo el mismo (la corrida continúa): solo se limpian los datos del pallet
    document.getElementById("ip-qty").value = "";
    document.getElementById("ip-def").value = "0";
    document.getElementById("ip-scrap").value = "0";
    setTipoEnvio('PLAN');
    precargarFormulario();
    window._misPalletsHoy.push(reg);
    renderHistorial();
  } catch(e){
    errEl.textContent = t('errSave') + e.message;
    errEl.style.display = "block";
  }
  btn.disabled = false; btn.textContent = t('save');
};

aplicarIdioma();
</script>
